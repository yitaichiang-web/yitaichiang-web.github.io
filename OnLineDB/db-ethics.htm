    <td valign="top">
	<a href="http://ethics.nctu.edu.tw/">臺灣學術倫理教育資源中心</a> <br>本計畫具有高等教育中學術倫理教育先導之角色，現行要務為檢視臺灣學術環境中之不當行為，分析學術倫理教育之需求，進一步蒐集相關資源，開發學術倫理教育之數位教材，以喚醒研究者的自律動力與倫理意識，並提升高等教育學生之品德涵養教育，建立學生良好的學術倫理態度與行為，以精進學術研究品質，確保學術活動的合宜性和合法性。 </td>
